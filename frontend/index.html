<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopora</title>
</head>
  <link rel="stylesheet" href="style.css">
<body>
  <h1>Stopora</h1>
  <p>Plan the smartest delivery route.</p>

  <h2>Add a delivery stop</h2>
  <form>
    <label for="stop-name">Stop name</label>
    <input type="text" id="stop-name" placeholder="e.g. Customer 1">

    <label for="latitude">Latitude</label>
    <input type="number" id="latitude" step="any" placeholder="Latitude">

    <label for="longitude">Longitude</label>
    <input type="number" id="longitude" step="any" placeholder="Longitude">

    <button type="button" id="add-stop">Add stop</button>
  </form>

  <h2>Your stops</h2>
  <ul id="stop-list"></ul>

  <button type="button" id="find-route">Find best route</button>
</body>
</html>
